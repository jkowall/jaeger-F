# CI Summary Report (Publish): posts PR comments and check runs for a CI
# Orchestrator run. The Coverage Gate and Metrics Comparison conclusions are
# computed here, with default-branch code, from the run's raw coverage profiles
# and metrics artifacts; the ci-summary artifact from ci-summary-report.yml only
# supplies display data.
#
# Triggered by workflow_run on CI Orchestrator completion (success OR failure).
# pull_request workflows from forks run with read-only permissions regardless of
# what the workflow file declares, so they cannot post PR comments or check runs.
# workflow_run always executes in the base repository context and gets the
# permissions declared here — that is why posting is split into this workflow.
# The heavy computation runs inside the CI Orchestrator itself (ci-summary-report.yml),
# making gate failures immediately visible in the PR Checks table without waiting
# for this workflow's separate approval step.
#
# Design: docs/adr/004-migrating-coverage-gating-to-github-actions.md
# Security model: see .github/scripts/ci-summary-report-publish.js

name: CI Summary Report (Publish)
run-name: Report for ${{ github.event.workflow_run.display_title }}
on:
  workflow_run:
    workflows: ["CI Orchestrator"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI Orchestrator run ID to publish summary for'
        required: true
# Scorecard Token-Permissions: keep writes on the publish job only.
permissions:
  contents: read
jobs:
  publish:
    name: Post Summary
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # Resolve the CI Orchestrator run ID so the artifact can be downloaded.
      # Inputs are passed through env and validated before use.
      - name: Resolve source run
        id: source-run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            RUN_ID="$DISPATCH_RUN_ID"
          else
            RUN_ID="$WORKFLOW_RUN_ID"
          fi
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run_id must be a positive integer."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Checkout the base repo so that .github/scripts/ci-summary-report-publish.js
      # and the coverage tools are available to the steps below.
      # Do NOT checkout the PR head: this workflow must only run base-repo code.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Download the ci-summary artifact and the raw coverage and metrics
      # artifacts the gates are scored from. On a fork PR every one of them was
      # produced by the fork's code: do not print them. Each pattern-matched
      # artifact lands in its own .artifacts/<name>/ directory, and only
      # ci-summary.json is taken from the ci-summary artifact, so no artifact can
      # supply the merged profile or the baseline the steps below create.
      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          rm -rf .artifacts .ci-summary
          mkdir -p .artifacts
          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name ci-summary \
            --dir .ci-summary \
          || echo "::warning::ci-summary artifact not found; proceeding without summary artifact (later checks may fail)."
          if [ -f .ci-summary/ci-summary.json ] && [ ! -L .ci-summary/ci-summary.json ]; then
            cp .ci-summary/ci-summary.json .artifacts/ci-summary.json
          fi
          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --pattern 'coverage-*' \
            --pattern 'metrics_snapshot_*' \
            --pattern 'diff_metrics_snapshot_*' \
            --dir .artifacts \
          || echo "::warning::No coverage or metrics artifacts found; Coverage Gate and Metrics Comparison will fail."

      # Merge and filter with this checkout's code only. Any failure leaves no
      # merged profile, which fails Coverage Gate.
      - name: Merge and filter coverage profiles
        run: node .github/scripts/coverage-profile.js merge .artifacts .artifacts/merged-coverage.out && python3 scripts/e2e/filter_coverage.py .artifacts/merged-coverage.out || rm -f .artifacts/merged-coverage.out

      # This workflow runs on the default branch, so it only sees caches saved by
      # main-branch runs. A push to main is not compared against the baseline,
      # matching the coverage gate in ci-summary-report.yml.
      - name: Restore baseline coverage from main
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event != 'push'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: .artifacts/baseline-coverage.txt
          key: coverage-baseline_${{ github.run_id }}
          restore-keys: |
            coverage-baseline_

      # The script takes the CI run, commit, and PR from `context`, so nothing
      # is interpolated into the script source.
      - name: Post PR comment and create check runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const handler = require('./.github/scripts/ci-summary-report-publish.js');
            await handler({ github, core, context, fs: require('fs') });
